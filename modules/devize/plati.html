<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cereri de plată — HUB Service Auto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script>
    window.supabaseClient = window.supabaseClient || (typeof supabaseClient !== 'undefined' ? supabaseClient : undefined);
  </script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh;
      background:#101012;
      color:#f2f2f3;
      font-family:'Inter', sans-serif;
      padding-bottom:48px;
    }
    .topbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:22px 32px;
      background:#161618;
      border-bottom:1px solid #232326;
      flex-wrap:wrap;
    }
    .topbar-left { display:flex; align-items:center; gap:14px; }
    .logo-badge {
      width:44px; height:44px; border-radius:12px;
      background:linear-gradient(135deg,#22d3c8,#0ea5a0);
      color:#0a0a0b; display:grid; place-items:center;
      font-size:14px; font-weight:800;
    }
    h1 { font-size:20px; font-weight:800; letter-spacing:-0.2px; }
    .subtitle { font-size:12.5px; color:#8a8a90; margin-top:3px; }
    .btn-link {
      font-size:12px; font-weight:700; color:#22d3c8;
      background:rgba(34,211,200,0.1);
      border:1px solid rgba(34,211,200,0.3);
      padding:8px 13px; border-radius:10px;
      text-decoration:none; white-space:nowrap;
    }
    .content { padding:28px 32px; max-width:1180px; margin:0 auto; }
    .grid { display:grid; grid-template-columns:minmax(280px, 420px) 1fr; gap:18px; align-items:start; }
    .card {
      background:#18181b;
      border:1px solid #232326;
      border-radius:16px;
      padding:20px;
    }
    .card-head { margin-bottom:16px; }
    .card-head h2 { font-size:15.5px; font-weight:700; }
    .card-sub { font-size:12.5px; color:#8a8a90; margin-top:3px; }
    .form-grid { display:grid; gap:13px; }
    label { display:grid; gap:6px; font-size:12px; color:#a3a3a9; font-weight:600; }
    input, textarea {
      width:100%;
      background:#101012;
      border:1px solid #2a2a2e;
      border-radius:10px;
      color:#f2f2f3;
      font-family:'Inter', sans-serif;
      font-size:13px;
      padding:10px 12px;
      outline:none;
    }
    textarea { min-height:96px; resize:vertical; }
    input:focus, textarea:focus { border-color:#22d3c8; }
    .primary-btn {
      border:none;
      border-radius:10px;
      background:#22d3c8;
      color:#0a0a0b;
      font-family:'Inter', sans-serif;
      font-size:13px;
      font-weight:800;
      padding:11px 14px;
      cursor:pointer;
    }
    .primary-btn:disabled { opacity:.6; cursor:not-allowed; }
    .message { min-height:20px; font-size:13px; color:#34e6ab; font-weight:600; }
    .table-wrap { overflow-x:auto; }
    .data-table { width:100%; border-collapse:collapse; }
    .data-table th {
      text-align:left; font-size:11.5px; text-transform:uppercase;
      letter-spacing:0.4px; color:#7a7a80; font-weight:600;
      padding:10px 12px; border-bottom:1px solid #232326;
    }
    .data-table td {
      padding:12px; font-size:13.5px; border-bottom:1px solid #1e1e21;
      vertical-align:top;
    }
    .data-table tr:hover td { background:#1e1e21; }
    .badge {
      display:inline-flex; align-items:center;
      font-size:11px; font-weight:800;
      padding:4px 10px; border-radius:20px;
      white-space:nowrap;
    }
    .badge-neplatit { background:rgba(245,166,35,0.12); color:#f5c26b; border:1px solid rgba(245,166,35,0.25); }
    .badge-platit { background:rgba(34,211,150,0.12); color:#34e6ab; border:1px solid rgba(34,211,150,0.25); }
    .delete-btn {
      border:1px solid rgba(255,90,90,0.3);
      background:rgba(255,90,90,0.1);
      color:#ff7a7a;
      border-radius:8px;
      font-family:'Inter', sans-serif;
      font-size:11px;
      font-weight:800;
      padding:6px 10px;
      cursor:pointer;
      white-space:nowrap;
    }
    .empty-row { color:#8a8a90; text-align:center; }
    @media (max-width:860px) {
      .content { padding:20px 16px; }
      .topbar { padding:18px 16px; }
      .grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-badge">PL</div>
      <div>
        <h1>Cereri de plată</h1>
        <p class="subtitle">Trimite și urmărește cererile de plată</p>
      </div>
    </div>
    <a class="btn-link" href="../../index.html">← Înapoi la HUB</a>
  </header>

  <main class="content">
    <div class="grid">
      <section class="card">
        <div class="card-head">
          <h2>Cerere nouă</h2>
          <p class="card-sub">Completează datele și trimite spre plată</p>
        </div>
        <form id="paymentForm" class="form-grid">
          <label>
            Beneficiar
            <input id="beneficiar" type="text" required autocomplete="off">
          </label>
          <label>
            IBAN
            <input id="iban" type="text" required autocomplete="off">
          </label>
          <label>
            Sumă
            <input id="suma" type="number" step="0.01" min="0" required>
          </label>
          <label>
            Motiv
            <textarea id="motiv" required></textarea>
          </label>
          <button class="primary-btn" id="submitBtn" type="submit">Trimite spre plată</button>
          <div class="message" id="successMessage"></div>
        </form>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Cererile introduse</h2>
          <p class="card-sub" id="tableScope">Se încarcă...</p>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Beneficiar</th>
                <th>Sumă</th>
                <th>Motiv</th>
                <th>Status</th>
                <th>Data</th>
                <th>Acțiuni</th>
              </tr>
            </thead>
            <tbody id="requestsBody">
              <tr><td class="empty-row" colspan="6">Se încarcă...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script>
    const sb = window.supabaseClient;
    let currentUser = null;
    let canViewAll = false;

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatLei(value) {
      return `${(Number(value) || 0).toLocaleString('ro-RO', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Lei`;
    }

    function formatDate(value) {
      if (!value) return '—';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return '—';
      return d.toLocaleDateString('ro-RO', { day:'2-digit', month:'2-digit', year:'numeric' });
    }

    function statusBadge(status) {
      const normalized = String(status || 'neplatit').toLowerCase();
      const cls = normalized === 'platit' ? 'badge-platit' : 'badge-neplatit';
      return `<span class="badge ${cls}">${escapeHtml(normalized)}</span>`;
    }

    async function verificaAcces() {
      try {
        if (!sb) throw new Error('Clientul Supabase nu este disponibil.');

        const { data: sessionData, error: sessionError } = await sb.auth.getSession();
        if (sessionError) throw sessionError;

        currentUser = sessionData?.session?.user || null;
        if (!currentUser?.id) {
          alert('Trebuie să fii autentificat pentru a accesa Cereri de plată.');
          window.location.href = '/index.html';
          return false;
        }

        const { data: profile, error: profileError } = await sb
          .from('auth_profiles')
          .select('rol_id, permissions')
          .eq('id', currentUser.id)
          .maybeSingle();

        if (profileError) throw profileError;

        const rolId = Number(profile?.rol_id);
        canViewAll = rolId === 1 || rolId === 2;
        const hasAccess = canViewAll || profile?.permissions?.plati === true;

        if (!hasAccess) {
          alert('Nu ai acces la Cereri de plată.');
          window.location.href = '/index.html';
          return false;
        }

        document.getElementById('tableScope').textContent = canViewAll
          ? 'Toate cererile de plată'
          : 'Doar cererile create de tine';

        return true;
      } catch (error) {
        console.error('Eroare verificare acces Cereri de plată:', error);
        alert('A apărut o eroare la verificarea accesului.');
        window.location.href = '/index.html';
        return false;
      }
    }

    async function incarcaCereri() {
      try {
        let query = sb
          .from('plati_manager')
          .select('id, beneficiar, iban, suma, motiv, status, data_crearii, creat_de')
          .order('data_crearii', { ascending:false });

        if (!canViewAll) {
          query = query.eq('creat_de', currentUser.id);
        }

        const { data, error } = await query;
        if (error) throw error;

        const tbody = document.getElementById('requestsBody');
        const rows = Array.isArray(data) ? data : [];

        if (!rows.length) {
          tbody.innerHTML = '<tr><td class="empty-row" colspan="6">Nu există cereri de plată.</td></tr>';
          return;
        }

        tbody.innerHTML = rows.map(row => `
          <tr>
            <td>${escapeHtml(row.beneficiar)}</td>
            <td>${formatLei(row.suma)}</td>
            <td>${escapeHtml(row.motiv)}</td>
            <td>${statusBadge(row.status)}</td>
            <td>${formatDate(row.data_crearii)}</td>
            <td>${String(row.status || '').toLowerCase() === 'neplatit' ? `<button class="delete-btn" data-delete-id="${row.id}" data-delete-name="${escapeHtml(row.beneficiar)}">Șterge</button>` : '—'}</td>
          </tr>
        `).join('');

        tbody.querySelectorAll('[data-delete-id]').forEach(btn => {
          btn.addEventListener('click', async () => {
            await stergeCerere(btn.dataset.deleteId, btn.dataset.deleteName);
          });
        });
      } catch (error) {
        console.error('Eroare încărcare cereri de plată:', error);
        alert('Nu s-au putut încărca cererile de plată.');
      }
    }

    async function stergeCerere(id, beneficiar) {
      if (!confirm(`Sigur ștergi cererea de plată pentru ${beneficiar || 'acest beneficiar'}?`)) return;

      try {
        const { data: row, error: readError } = await sb
          .from('plati_manager')
          .select('status')
          .eq('id', id)
          .single();

        if (readError) throw readError;
        if (String(row?.status || '').toLowerCase() !== 'neplatit') {
          alert('Cererile deja plătite nu pot fi șterse.');
          await incarcaCereri();
          return;
        }

        const { error } = await sb
          .from('plati_manager')
          .delete()
          .eq('id', id);

        if (error) throw error;
        await incarcaCereri();
      } catch (error) {
        console.error('Eroare ștergere cerere de plată:', error);
        alert('Cererea de plată nu a putut fi ștearsă.');
      }
    }

    async function salveazaCerere(event) {
      event.preventDefault();

      const form = document.getElementById('paymentForm');
      const submitBtn = document.getElementById('submitBtn');
      const successMessage = document.getElementById('successMessage');
      successMessage.textContent = '';

      const payload = {
        beneficiar: document.getElementById('beneficiar').value.trim(),
        iban: document.getElementById('iban').value.trim(),
        suma: Number(document.getElementById('suma').value),
        motiv: document.getElementById('motiv').value.trim(),
        status: 'neplatit',
        creat_de: currentUser.id
      };

      if (!payload.beneficiar || !payload.iban || !payload.suma || !payload.motiv) {
        alert('Completează toate câmpurile înainte de trimitere.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Se trimite...';

      try {
        const { error } = await sb
          .from('plati_manager')
          .insert(payload);

        if (error) throw error;

        form.reset();
        successMessage.textContent = 'Cererea de plată a fost trimisă.';
        await incarcaCereri();
      } catch (error) {
        console.error('Eroare salvare cerere de plată:', error);
        alert('Cererea de plată nu a fost salvată.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Trimite spre plată';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const allowed = await verificaAcces();
      if (!allowed) return;

      document.getElementById('paymentForm').addEventListener('submit', salveazaCerere);
      await incarcaCereri();
    });
  </script>
</body>
</html>
