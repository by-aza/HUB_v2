<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/192x192.png">
    <meta name="theme-color" content="#14161c">
    <title>Căutare Devize - HUB Service Auto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/css/style.css">
</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --bg: #14161c;
            --surface: #181b22;
            --card: #1b1e26;
            --border: rgba(255,255,255,0.08);
            --text: #f1f2f4;
            --muted: #98a0ad;
            --accent: #2dd4cf;
            --danger: #ef4757;
            --success: #27c79a;
            --warning: #f5b32b;
            --violet: #a78bfa;
            --shadow: 0 16px 34px rgba(0, 0, 0, 0.22);
        }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .mono-text {
            font-family: 'JetBrains Mono', monospace;
        }

        .page-shell {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 30px;
            padding-right: 30px;
        }

        .result-state {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            box-shadow: none;
        }

        .page-header {
            margin: 0 auto;
            border-bottom: 1px solid var(--border);
        }

        .page-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 20px 0 18px;
        }

        .page-header-title h1 {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.15;
            font-weight: 800;
            color: var(--text);
            letter-spacing: 0.02em;
        }

        .page-header-title p {
            margin: 6px 0 0;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 15px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            background: rgba(148, 163, 184, 0.10);
            color: var(--text);
            font-size: 0.84rem;
            font-weight: 700;
            text-decoration: none;
            transition: 0.18s ease;
        }

        .back-button:hover {
            background: rgba(148, 163, 184, 0.18);
        }

        .search-shell {
            margin: 18px auto 0;
            padding: 0 0 14px;
            border-bottom: 1px solid var(--border);
        }

        .toolbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .tab-switcher {
            max-width: 480px;
            margin: 0;
            padding: 4px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(24, 27, 34, 0.84);
        }

        .history-tab-btn {
            min-height: 42px;
            border: 1px solid transparent;
            color: var(--muted) !important;
            background: transparent !important;
            transition: 0.18s ease;
        }

        .history-tab-btn:hover {
            background: rgba(148, 163, 184, 0.08) !important;
            color: var(--text) !important;
        }

        .history-tab-btn.bg-blue-600 {
            background: rgba(45, 212, 207, 0.16) !important;
            border-color: rgba(45, 212, 207, 0.24) !important;
            color: #dffcfb !important;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: none;
            width: 100%;
            margin: 0;
            flex: 1;
            justify-content: flex-end;
        }

        .search-field-wrap {
            position: relative;
            flex: 1;
            width: 100%;
        }

        .search-field-wrap::before {
            content: '⌕';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1rem;
            line-height: 1;
            pointer-events: none;
        }

        .search-button {
            min-height: 40px;
            padding: 0 18px;
            border: 1px solid rgba(45, 212, 207, 0.24);
            border-radius: 10px;
            background: rgba(45, 212, 207, 0.15);
            color: #dffcfb;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        #search-input {
            width: 100%;
            min-height: 40px;
            margin: 0;
            padding: 0 16px 0 44px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #13161f;
            color: var(--text);
            box-shadow: none;
        }

        #search-input::placeholder {
            color: #7f8795;
        }

        #search-input:focus {
            outline: none;
            border-color: rgba(45, 212, 207, 0.75);
            box-shadow: 0 0 0 3px rgba(45, 212, 207, 0.12);
        }

        .results-shell {
            margin: 20px auto 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
        }

        .results-head {
            margin: 0;
            padding: 12px 18px;
            position: sticky;
            top: 0;
            z-index: 5;
            backdrop-filter: blur(10px);
            background: rgba(24, 27, 34, 0.98);
            box-shadow: none;
            border-bottom: 1px solid var(--border);
        }

        .results-head > div {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.08em;
        }

        #results {
            padding-top: 0;
            padding-bottom: 0;
        }

        #results-inner {
            background: var(--card);
        }

        #results-inner .hub-card {
            margin-bottom: 0;
            padding: 0 18px;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            transition: background-color 0.18s ease;
        }

        #results-inner .hub-card:hover {
            background: rgba(255,255,255,0.02);
        }

        #results-inner .hub-card > div {
            display: grid;
            grid-template-columns: 0.95fr 1.4fr 0.95fr 1fr auto;
            gap: 16px;
            align-items: center;
            min-height: 58px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        #results-inner .hub-card > div > div {
            min-width: 0;
        }

        #results-inner .hub-card > div > div:nth-child(1) {
            color: var(--muted);
            font-size: 0.84rem;
        }

        #results-inner .hub-card > div > div:nth-child(2) {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text) !important;
            letter-spacing: 0.02em;
        }

        #results-inner .hub-card > div > div:nth-child(3) {
            display: inline-flex;
            align-items: center;
            justify-self: start;
            min-height: 28px;
            padding: 0 9px;
            border-radius: 999px;
            border: 1px solid rgba(45, 212, 207, 0.16);
            background: rgba(45, 212, 207, 0.10);
            color: #dffcfb !important;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
        }

        #results-inner .hub-card > div > div:nth-child(3):has([href*="deviz_final"]) {
            border-color: rgba(167, 139, 250, 0.18);
            background: rgba(167, 139, 250, 0.12);
            color: #e4ddff !important;
        }

        #results-inner .hub-card > div > div:nth-child(4) {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--success) !important;
            text-align: right;
            justify-self: end;
        }

        #results-inner .hub-card > div > div:nth-child(5) {
            justify-self: end;
        }

        #results-inner .hub-card > div > div:nth-child(5) a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 13px;
            border: 1px solid rgba(45, 212, 207, 0.24);
            border-radius: 10px;
            background: rgba(45, 212, 207, 0.14) !important;
            color: #dffcfb !important;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            transition: 0.18s ease;
        }

        #results-inner .hub-card > div > div:nth-child(5) a:hover {
            background: rgba(45, 212, 207, 0.22) !important;
        }

        .result-state {
            padding: 18px;
            text-align: center;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .result-state.loading::before {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 10px;
            border-radius: 999px;
            border: 2px solid rgba(45, 212, 207, 0.18);
            border-top-color: var(--accent);
            animation: hub-spin 0.8s linear infinite;
            vertical-align: -3px;
        }

        .result-state.error {
            color: #ffb9c1;
            border-color: rgba(239, 71, 87, 0.16);
            background: rgba(239, 71, 87, 0.08);
        }

        @keyframes hub-spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 767px) {
            html {
                min-height: 100%;
                overflow-x: hidden;
            }

            body.h-screen.overflow-hidden {
                height: auto !important;
                min-height: 100% !important;
                max-height: none !important;
                overflow-x: hidden !important;
                overflow-y: visible !important;
            }

            .page-header-inner {
                display: grid;
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 14px 0;
            }

            .page-header-title h1 {
                font-size: 1rem;
            }

            .page-header-title p {
                font-size: 0.8rem;
            }

            .back-button {
                width: 100%;
            }

            .search-shell {
                margin-top: 10px;
                padding: 0 0 12px;
            }

            .toolbar-row {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .history-tab-btn {
                padding: 8px 10px !important;
                font-size: 0.75rem !important;
            }

            .search-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .search-button {
                width: 100%;
            }

            #results.flex-1.overflow-y-auto {
                flex: 0 0 auto !important;
                height: auto !important;
                min-height: 0 !important;
                max-height: none !important;
                overflow: visible !important;
                padding: 0;
            }

            #results-inner {
                width: 100%;
                overflow: visible;
            }

            #results-inner .hub-card {
                margin-bottom: 10px;
                padding: 12px;
                border: 1px solid var(--border);
                border-radius: 14px;
                background: var(--card);
            }

            #results-inner .hub-card > div {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                grid-template-areas:
                    "plate number"
                    "date value"
                    "action action";
                gap: 8px 10px;
                min-height: 0;
                padding: 0;
                border-bottom: 0;
            }

            #results-inner .hub-card > div > div {
                min-width: 0;
            }

            #results-inner .hub-card > div > div:nth-child(1) {
                grid-area: date;
                justify-self: start;
                text-align: left;
                white-space: nowrap;
            }

            #results-inner .hub-card > div > div:nth-child(2) {
                grid-area: plate;
                overflow-wrap: anywhere;
            }

            #results-inner .hub-card > div > div:nth-child(3) {
                grid-area: number;
                justify-self: end;
            }

            #results-inner .hub-card > div > div:nth-child(4) {
                grid-area: value;
                justify-self: end;
                text-align: right;
                white-space: nowrap;
            }

            #results-inner .hub-card > div > div:nth-child(5) {
                grid-area: action;
                justify-self: stretch;
                text-align: left;
            }

            #results-inner .hub-card > div > div:nth-child(5) a {
                width: 100%;
                min-height: 38px;
                padding: 8px 14px;
            }

            .page-shell {
                padding-left: 14px;
                padding-right: 14px;
            }
        }

        /* Scroll listă devize pe desktop */
@media (min-width: 768px) {
    .results-shell {
        height: calc(100vh - 240px);
        display: flex;
        flex-direction: column;
    }

    #results {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
    }
}

    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-950 text-slate-200">
    <header class="page-shell page-header shrink-0">
        <div class="page-header-inner">
            <div class="page-header-title">
                <h1>Căutare Devize</h1>
                <p>Caută rapid devize estimative și finale.</p>
            </div>
            <a href="../../index.html" class="back-button">Înapoi la HUB</a>
        </div>
    </header>

    <div class="page-shell shrink-0">
        <div class="search-shell">
            <div class="toolbar-row">
                <div class="tab-switcher flex justify-center">
                    <button
                        id="tab-estimative"
                        type="button"
                        class="history-tab-btn flex-1 rounded-xl bg-blue-600 px-4 py-2 text-sm font-bold text-white transition-colors"
                        data-type="estimative"
                    >
                        Devize Estimative
                    </button>
                    <button
                        id="tab-finale"
                        type="button"
                        class="history-tab-btn flex-1 rounded-xl px-4 py-2 text-sm font-bold text-slate-300 transition-colors hover:bg-slate-800"
                        data-type="finale"
                    >
                        Devize Finale
                    </button>
                </div>
                <div class="search-bar">
                    <div class="search-field-wrap">
                        <input id="search-input" type="search" placeholder="Caută după nr. înmatriculare sau ID Deviz..." class="block text-base" />
                    </div>
                </div>
            </div>
        </div>
        <div class="results-shell">
            <div class="results-head grid grid-cols-[1fr_1.5fr_1fr_1fr_0.5fr] gap-4">
                <div>DATA</div>
                <div>AUTO</div>
                <div>DEVIZ</div>
                <div class="text-right">TOTAL</div>
                <div class="text-right">ACȚIUNE</div>
            </div>
            <div id="results" class="flex-1 overflow-y-auto">
                <div id="results-inner"></div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://xyovkxmtbvgcwavuyxxu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5b3ZreG10YnZnY3dhdnV5eHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDI1ODMsImV4cCI6MjA5NTkxODU4M30.r-_Q0vTd4IdZrfJTwpsy8ptVp5krofFGKi4BqtHQl74';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const searchInput = document.getElementById('search-input');
        const resultsInner = document.getElementById('results-inner');
        const historyTabButtons = Array.from(document.querySelectorAll('.history-tab-btn'));

        let activeTab = 'estimative';
        let allDevize = [];
        let query = '';

        const isConfigured = () => supabaseUrl && supabaseKey && !supabaseUrl.includes('PUNE_') && !supabaseKey.includes('PUNE_');

        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        })[ch]);

        const formatMoney = (value) => {
            const n = Number(value);
            if (!Number.isFinite(n)) return '0.00';
            return n.toFixed(2);
        };

        const formatDate = (value) => {
            if (!value) return '';
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return String(value);
            const zi = String(d.getDate()).padStart(2, '0');
            const luna = String(d.getMonth() + 1).padStart(2, '0');
            const an = d.getFullYear();
            return `${zi}.${luna}.${an}`;
        };

        const formatDevizNumber = (type, rawId) => {
            const numericId = String(rawId ?? '').replace(/\D/g, '');
            if (type === 'finale') return numericId ? `DF-${numericId.padStart(3, '0')}` : '';
            if (type === 'estimative') return numericId ? `D-${numericId}` : '';
            return String(rawId ?? '');
        };

        const getDevizLink = (type, rawId) => {
            const numericId = String(rawId ?? '').replace(/\D/g, '');
            if (type === 'finale') return `deviz_final.html?id=${encodeURIComponent(numericId)}`;
            return `deviz.html?id=${encodeURIComponent(rawId)}`;
        };

        const updateTabButtons = () => {
            historyTabButtons.forEach((button) => {
                const active = button.dataset.type === activeTab;
                button.className = active
                    ? 'history-tab-btn flex-1 rounded-xl bg-blue-600 px-4 py-2 text-sm font-bold text-white transition-colors'
                    : 'history-tab-btn flex-1 rounded-xl px-4 py-2 text-sm font-bold text-slate-300 transition-colors hover:bg-slate-800';
            });
        };

        const applyFilter = () => {
            const q = query.trim().toLowerCase();
            if (!q) return allDevize;
            return allDevize.filter((d) => {
                const plate = String(d.nr_inmatriculare ?? '').toLowerCase();
                const id = String(d.display_id ?? d.id_deviz ?? d.id_deviz_final ?? '').toLowerCase();
                return plate.includes(q) || id.includes(q);
            });
        };

        const render = () => {
            const list = applyFilter();
            resultsInner.innerHTML = list.map((d) => `
                <div class="bg-slate-800 hover:bg-slate-700 p-4 rounded-lg mb-2 border border-slate-700 transition-colors hub-card">
                    <div class="grid grid-cols-[1fr_1.5fr_1fr_1fr_0.5fr] gap-4 items-center">
                        <div class="text-slate-300">${escapeHtml(formatDate(d.data_deviz))}</div>
                        <div class="font-bold uppercase text-slate-100">${escapeHtml(d.nr_inmatriculare || '')}</div>
                        <div class="text-slate-200 font-semibold">${escapeHtml(d.display_id || '')}</div>
                        <div class="text-emerald-400 font-bold">${escapeHtml(formatMoney(d.total_general))} RON</div>
                        <div class="text-right">
                            <a href="${escapeHtml(d.view_href || '#')}" class="inline-flex items-center justify-center rounded-xl bg-blue-600 hover:bg-blue-500 px-3 py-2 text-xs font-bold text-white transition-colors">
                                VEZI
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');

            if (!list.length) {
                resultsInner.innerHTML = '<div class="result-state">Nu au fost găsite devize.</div>';
            }
        };

        const fetchDevize = async () => {
            if (!isConfigured()) {
                resultsInner.innerHTML = '<div class="result-state error">Completează supabaseUrl și supabaseKey în script.</div>';
                return;
            }

            resultsInner.innerHTML = '<div class="result-state loading">Se încarcă devizele...</div>';

            const queryBuilder = activeTab === 'finale'
                ? supabaseClient
                    .from('deviz_final_header')
                    .select('id_deviz_final, data_deviz, nr_inmatriculare, total_general')
                    .order('id_deviz_final', { ascending: false })
                : supabaseClient
                    .from('devize')
                    .select('id_deviz, data_deviz, nr_inmatriculare, total_general')
                    .order('id_deviz', { ascending: false });

            const { data, error } = await queryBuilder;

            if (error) {
                console.error(error);
                resultsInner.innerHTML = '<div class="result-state error">Eroare la încărcare.</div>';
                return;
            }

            allDevize = (Array.isArray(data) ? data : []).map((row) => {
                const rawId = activeTab === 'finale' ? row.id_deviz_final : row.id_deviz;
                return {
                    ...row,
                    display_id: formatDevizNumber(activeTab, rawId),
                    view_href: getDevizLink(activeTab, rawId),
                    total_general: row.total_general ?? 0,
                };
            });
            render();
        };

        searchInput.addEventListener('input', (e) => {
            query = e.target.value || '';
            render();
        });

        historyTabButtons.forEach((button) => {
            button.addEventListener('click', async () => {
                const nextTab = button.dataset.type;
                if (!nextTab || nextTab === activeTab) return;
                activeTab = nextTab;
                updateTabButtons();
                await fetchDevize();
            });
        });

        updateTabButtons();
        fetchDevize();
    </script>
    <!-- Autodeconectare după inactivitate -->
    <script src="/js/session-timeout.js?v=2"></script>
</body>
</html>
