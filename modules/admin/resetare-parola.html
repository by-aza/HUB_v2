<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/192x192.png">
    <meta name="theme-color" content="#14161c">
    <title>HUB — Setează parola nouă</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/config.js"></script>
</head>
<body class="min-h-screen bg-[#14161c] px-4 py-8 text-slate-200 flex items-center justify-center">
    <main class="w-full max-w-md rounded-2xl border border-white/10 bg-[#1b1e26] p-6 shadow-2xl shadow-black/30 sm:p-8">
        <h1 class="text-2xl font-bold text-slate-100">Setează parola nouă</h1>
        <p class="mt-2 text-sm leading-6 text-slate-400">Introdu o parolă nouă pentru contul asociat linkului primit prin email.</p>

        <form id="reset-password-form" class="mt-6 space-y-4">
            <div>
                <label for="new-password" class="mb-1.5 block text-sm font-medium text-slate-300">Parolă nouă</label>
                <input id="new-password" type="password" autocomplete="new-password" minlength="8" required disabled class="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-2.5 text-sm text-slate-100 outline-none transition-colors focus:border-cyan-500 disabled:cursor-not-allowed disabled:opacity-60">
            </div>
            <div>
                <label for="confirm-password" class="mb-1.5 block text-sm font-medium text-slate-300">Confirmă parola</label>
                <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required disabled class="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-2.5 text-sm text-slate-100 outline-none transition-colors focus:border-cyan-500 disabled:cursor-not-allowed disabled:opacity-60">
            </div>

            <div id="status-message" role="status" aria-live="polite" class="rounded-xl border border-slate-700 bg-slate-900/60 px-3 py-2.5 text-sm text-slate-300">
                Se verifică linkul de resetare...
            </div>

            <button id="save-password-btn" type="submit" disabled class="w-full rounded-xl bg-cyan-600 px-4 py-2.5 text-sm font-bold text-white transition-colors hover:bg-cyan-500 disabled:cursor-not-allowed disabled:opacity-60">
                Salvează parola
            </button>
        </form>

        <a href="login.html" class="mt-4 block w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-2.5 text-center text-sm font-semibold text-slate-200 transition-colors hover:bg-slate-700">
            Înapoi la autentificare
        </a>
    </main>

    <script>
        const form = document.getElementById('reset-password-form');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const saveButton = document.getElementById('save-password-btn');
        const statusMessage = document.getElementById('status-message');
        let recoverySessionReady = false;

        function showStatus(message, type = 'error') {
            const styles = {
                pending: 'border-slate-700 bg-slate-900/60 text-slate-300',
                error: 'border-rose-500/30 bg-rose-500/10 text-rose-400',
                success: 'border-emerald-500/30 bg-emerald-500/10 text-emerald-400'
            };
            statusMessage.className = `rounded-xl border px-3 py-2.5 text-sm ${styles[type] || styles.error}`;
            statusMessage.textContent = message;
        }

        function enablePasswordForm() {
            recoverySessionReady = true;
            newPasswordInput.disabled = false;
            confirmPasswordInput.disabled = false;
            saveButton.disabled = false;
            showStatus('Link valid. Poți seta parola nouă.', 'pending');
            newPasswordInput.focus();
        }

        function getRecoveryLinkError() {
            const query = new URLSearchParams(window.location.search);
            const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            return query.get('error_description') || hash.get('error_description') || query.get('error') || hash.get('error') || '';
        }

        if (typeof supabaseClient === 'undefined') {
            showStatus('Conexiunea Supabase nu a putut fi inițializată.');
        } else {
            const linkError = getRecoveryLinkError();
            if (linkError) {
                showStatus(`Linkul de resetare este invalid sau a expirat: ${linkError}`);
            } else {
                supabaseClient.auth.onAuthStateChange((event) => {
                    if (event === 'PASSWORD_RECOVERY') enablePasswordForm();
                });

                window.setTimeout(() => {
                    if (!recoverySessionReady) {
                        showStatus('Linkul de resetare este invalid sau a expirat. Solicită un email nou de resetare.');
                    }
                }, 2500);
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!recoverySessionReady) {
                showStatus('Linkul de resetare nu este valid sau a expirat.');
                return;
            }

            const newPassword = newPasswordInput.value;
            const confirmedPassword = confirmPasswordInput.value;

            if (!newPassword || !confirmedPassword) {
                showStatus('Completează ambele câmpuri pentru parolă.');
                return;
            }
            if (newPassword.length < 8) {
                showStatus('Parola trebuie să aibă minimum 8 caractere.');
                return;
            }
            if (newPassword !== confirmedPassword) {
                showStatus('Parolele introduse nu sunt identice.');
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = 'Se salvează...';

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });
                if (error) throw error;

                showStatus('Parola a fost schimbată cu succes.', 'success');
                window.setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                console.error(error);
                showStatus(error.message || String(error));
                saveButton.disabled = false;
                saveButton.textContent = 'Salvează parola';
            }
        });
    </script>
</body>
</html>
