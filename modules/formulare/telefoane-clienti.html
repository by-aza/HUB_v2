<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registru Telefoane - HUB Service Auto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="manifest" href="/manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js');
            });
        }
    </script>
    <style>
        body { background-color: #020617; }
        .panel-card { background-color: #0f172a; border: 1px solid #1e293b; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="text-slate-200 font-sans h-screen flex flex-col overflow-hidden">
    
    <!-- HEADER CONTROLS -->
    <header class="panel-card p-4 flex flex-col gap-4 z-20 shadow-2xl">
        <div class="flex flex-row items-center gap-4">
            <a href="../../index.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition-all group shrink-0">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
                <span class="font-bold uppercase tracking-wider text-xs">Înapoi</span>
            </a>
            <h1 class="text-lg md:text-xl font-black uppercase tracking-widest text-blue-400 whitespace-nowrap overflow-hidden text-ellipsis">REGISTRU TELEFOANE</h1>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                <input type="text" id="searchInput" placeholder="Caută client, telefon sau observații..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-slate-100 focus:outline-none focus:border-blue-500 transition-all shadow-inner text-base"
                    oninput="handleSearch()">
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-black uppercase text-xs tracking-wider flex items-center justify-center gap-2 transition-all shadow-lg active:scale-95">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                Adaugă Client
            </button>
        </div>
    </header>

    <!-- CLIENT LIST TABLE -->
    <div class="flex-1 overflow-hidden flex flex-col p-4">
        <div class="panel-card rounded-2xl flex-1 flex flex-col overflow-hidden shadow-2xl">
            <div class="overflow-x-auto overflow-y-auto custom-scrollbar flex-1">
                <table class="w-full text-left border-collapse md:table block">
                    <thead class="sticky top-0 bg-slate-900 z-10 md:table-header-group hidden">
                        <tr class="text-slate-300 text-lg font-bold tracking-wide border-b border-slate-800">
                            <th class="p-4">Client</th>
                            <th class="p-4">Observații</th>
                            <th class="p-4">Telefon</th>
                            <th class="p-4 text-center">Acțiuni</th>
                        </tr>
                    </thead>
                    <tbody id="clientsBody" class="text-base divide-y divide-slate-800/50 block md:table-row-group">
                        <!-- Content generated by JS -->
                    </tbody>
                </table>
            </div>
            <!-- Summary Footer -->
            <div class="p-3 bg-slate-900/50 border-t border-slate-800 text-[10px] font-mono text-slate-500 flex justify-between">
                <div>Total Clienți: <span id="totalClients" class="text-slate-300 font-bold">0</span></div>
                <div>Sincronizat Supabase Realtime</div>
            </div>
        </div>
    </div>

    <!-- MODAL ADD/EDIT -->
    <div id="clientModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="panel-card w-full max-w-md rounded-3xl shadow-2xl transform transition-all overflow-hidden">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h2 id="modalTitle" class="text-lg font-black uppercase tracking-widest text-blue-400">Adaugă Client</h2>
                <button onclick="closeModal()" class="text-slate-500 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <form id="clientForm" onsubmit="saveClient(event)" class="p-6 space-y-4">
                <input type="hidden" id="clientId">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 ml-1">Client</label>
                    <input type="text" id="clientName" required class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-slate-100 focus:outline-none focus:border-blue-500 transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 ml-1">Observații</label>
                    <textarea id="clientObs" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-slate-100 focus:outline-none focus:border-blue-500 transition-all"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 ml-1">Telefon</label>
                    <input type="text" id="clientPhone" required placeholder="Ex: 076XXXXXXX" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-slate-100 focus:outline-none focus:border-blue-500 transition-all">
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl font-bold uppercase text-xs tracking-wider transition-all">Anulează</button>
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-black uppercase text-xs tracking-wider transition-all shadow-lg">Salvează</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const dbUrl = 'https://xyovkxmtbvgcwavuyxxu.supabase.co';
        const dbKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5b3ZreG10YnZnY3dhdnV5eHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDI1ODMsImV4cCI6MjA5NTkxODU4M30.r-_Q0vTd4IdZrfJTwpsy8ptVp5krofFGKi4BqtHQl74';
        const sb = supabase.createClient(dbUrl, dbKey);

        let allClients = [];

        async function init() {
            lucide.createIcons();
            await fetchClients();
            setupRealtime();
        }

        async function fetchClients() {
            const { data, error } = await sb
                .from('telefoane_clienti')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Error fetching clients:', error);
                return;
            }

            allClients = data;
            renderClients(allClients);
        }

        function renderClients(data) {
            const body = document.getElementById('clientsBody');
            document.getElementById('totalClients').textContent = data.length;
            
            body.innerHTML = data.map(c => `
                <tr class="hover:bg-slate-800/30 transition-colors border-b border-slate-800/30 group block md:table-row md:mb-0 mb-3 p-3 md:p-0 bg-slate-800/50 md:bg-transparent rounded-xl border border-slate-700 md:border-0 shadow-lg md:shadow-none">
                    <td class="p-0 md:p-4 font-bold text-lg text-slate-100 block md:table-cell">
                        <span class="md:text-base md:font-black">${c.client || '-'}</span>
                    </td>
                    <td class="p-0 md:p-4 text-slate-400 block md:table-cell">
                        <span class="text-sm leading-tight md:text-slate-300">${c.observatii || '-'}</span>
                    </td>
                    <td class="p-0 md:p-4 block md:table-cell mt-2 md:mt-0">
                        <div class="flex flex-row justify-between items-center w-full">
                            <a href="tel:${c.telefon}" class="text-blue-400 hover:text-blue-300 font-mono font-black flex items-center gap-2 transition-all text-base">
                                <i data-lucide="phone" class="w-4 h-4"></i>
                                ${c.telefon}
                            </a>
                            <div class="flex justify-end md:justify-center items-center gap-1.5 md:gap-4 md:hidden">
                                <a href="${formatWhatsApp(c.telefon)}" target="_blank" class="w-8 h-8 p-1.5 rounded-lg bg-emerald-600/20 text-emerald-500 hover:bg-emerald-600 hover:text-white flex items-center justify-center transition-all shadow-sm" title="WhatsApp">
                                    <i data-lucide="message-circle" class="w-full h-full"></i>
                                </a>
                                <button onclick='openEditModal(${JSON.stringify(c).replace(/'/g, "&apos;")})' class="w-8 h-8 p-1.5 rounded-lg bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white flex items-center justify-center transition-all shadow-sm" title="Editează">
                                    <i data-lucide="edit-3" class="w-full h-full"></i>
                                </button>
                                <button onclick="deleteClient(${c.id}, this)" class="w-8 h-8 p-1.5 rounded-lg bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white flex items-center justify-center transition-all shadow-sm delete-btn" title="Șterge">
                                    <i data-lucide="trash-2" class="w-full h-full"></i>
                                </button>
                            </div>
                        </div>
                    </td>
                    <!-- PC Only actions cell -->
                    <td class="hidden md:table-cell p-4">
                        <div class="flex justify-center items-center gap-4">
                            <a href="${formatWhatsApp(c.telefon)}" target="_blank" class="w-10 h-10 rounded-xl bg-emerald-600/20 text-emerald-500 hover:bg-emerald-600 hover:text-white flex items-center justify-center transition-all shadow-sm" title="WhatsApp">
                                <i data-lucide="message-circle" class="w-5 h-5"></i>
                            </a>
                            <button onclick='openEditModal(${JSON.stringify(c).replace(/'/g, "&apos;")})' class="w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white flex items-center justify-center transition-all shadow-sm" title="Editează">
                                <i data-lucide="edit-3" class="w-5 h-5"></i>
                            </button>
                            <button onclick="deleteClient(${c.id}, this)" class="w-10 h-10 rounded-xl bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white flex items-center justify-center transition-all shadow-sm delete-btn" title="Șterge">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function handleSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allClients.filter(c => 
                (c.client || '').toLowerCase().includes(term) ||
                (c.telefon || '').toLowerCase().includes(term) ||
                (c.observatii || '').toLowerCase().includes(term)
            );
            renderClients(filtered);
        }

        function formatWhatsApp(phone) {
            if (!phone) return '#';
            let clean = phone.replace(/\s+/g, '');
            if (clean.startsWith('0')) clean = '40' + clean.substring(1);
            return `https://wa.me/${clean}`;
        }

        function openModal() {
            document.getElementById('modalTitle').textContent = 'Adaugă Client';
            document.getElementById('clientForm').reset();
            document.getElementById('clientId').value = '';
            document.getElementById('clientModal').classList.remove('hidden');
        }

        function openEditModal(client) {
            document.getElementById('modalTitle').textContent = 'Editează Client';
            document.getElementById('clientId').value = client.id;
            document.getElementById('clientName').value = client.client;
            document.getElementById('clientObs').value = client.observatii || '';
            document.getElementById('clientPhone').value = client.telefon;
            document.getElementById('clientModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('clientModal').classList.add('hidden');
        }

        async function saveClient(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            
            // UX Anti-Spam: Dezactivează butonul
            btn.disabled = true;
            btn.textContent = "Se salvează...";
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            const id = document.getElementById('clientId').value;
            const client = {
                client: document.getElementById('clientName').value,
                observatii: document.getElementById('clientObs').value,
                telefon: document.getElementById('clientPhone').value
            };

            try {
                if (id) {
                    const { error } = await sb.from('telefoane_clienti').update(client).eq('id', id);
                    if (!error) sendSystemNotification("✅ Modificare", `Datele clientului ${client.client} au fost actualizate.`);
                    else throw error;
                } else {
                    const { error } = await sb.from('telefoane_clienti').insert([client]);
                    if (!error) sendSystemNotification("👤 Client Nou", `${client.client} a fost adăugat în registru.`);
                    else throw error;
                }
                closeModal();
                fetchClients();
            } catch (err) {
                console.error('Error saving client:', err);
                alert('Eroare la salvare: ' + (err.message || 'Server error'));
            } finally {
                // Restabilește starea butonului
                btn.disabled = false;
                btn.textContent = originalText;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        async function deleteClient(id, btnElement) {
            if (!confirm('Ești sigur că vrei să ștergi acest client?')) return;
            
            const client = allClients.find(c => c.id === id);
            
            // UX Anti-Spam: Dezactivează butonul de ștergere
            const originalHTML = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.classList.add('opacity-50', 'cursor-not-allowed');
            btnElement.innerHTML = '<i data-lucide="loader" class="w-6 h-6 animate-spin"></i>';
            lucide.createIcons();

            try {
                const { error } = await sb.from('telefoane_clienti').delete().eq('id', id);
                if (!error) {
                    sendSystemNotification("🗑️ Ștergere", `Clientul ${client?.client || ''} a fost eliminat.`);
                    fetchClients();
                } else throw error;
            } catch (err) {
                console.error('Error deleting client:', err);
                alert('Eroare la ștergere: ' + (err.message || 'Server error'));
                // Restabilește butonul doar în caz de eroare, la succes tabelul se randează din nou
                btnElement.disabled = false;
                btnElement.classList.remove('opacity-50', 'cursor-not-allowed');
                btnElement.innerHTML = originalHTML;
                lucide.createIcons();
            }
        }

        // --- REALTIME & NOTIFICATIONS ---
        if (Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }

        function sendSystemNotification(title, body) {
            if (Notification.permission === "granted") {
                const n = new Notification(title, { body, icon: "../../icons/128x128.png" });
                setTimeout(() => n.close(), 5000);
            }
        }

        function setupRealtime() {
            sb.channel('db_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'telefoane_clienti' }, payload => {
                    if (payload.eventType === 'INSERT') {
                        sendSystemNotification("👤 Client Nou", `${payload.new.client} a fost adăugat.`);
                    } else if (payload.eventType === 'UPDATE') {
                        sendSystemNotification("✅ Modificare", `Datele lui ${payload.new.client} au fost actualizate.`);
                    } else if (payload.eventType === 'DELETE') {
                        sendSystemNotification("🗑️ Ștergere", "Un client a fost eliminat din registru.");
                    }
                    fetchClients();
                })
                .subscribe();
        }

        window.onload = init;
    </script>
</body>
</html>
