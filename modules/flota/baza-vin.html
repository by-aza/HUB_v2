<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bază Date VIN - HUB Service Auto</title>
    <script src="https://cdn.tailwindcss.com?plugins=line-clamp"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="manifest" href="/manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js');
            });
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; }
        .hub-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.7);
            transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
        }
        .hub-btn:hover { background: rgba(15, 23, 42, 0.9); border-color: rgba(100, 116, 139, 0.7); color: #ffffff; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-950 text-slate-200">
    <header class="shrink-0 border-b border-slate-800/60 bg-slate-950/80 backdrop-blur">
        <div class="px-4 py-4">
            <div class="grid grid-cols-3 items-center gap-3">
                <a href="../../index.html" class="hub-btn justify-self-start">
                    <- Înapoi
                </a>
                <div class="justify-self-center text-center text-base sm:text-lg font-bold text-purple-400 tracking-wide">
                    BAZĂ DATE VIN
                </div>
                <button id="btn-open-modal" type="button" class="justify-self-end inline-flex items-center rounded-xl bg-purple-600 hover:bg-purple-500 px-4 py-2 text-sm font-bold text-white shadow-sm transition-colors">
                    + ADAUGĂ
                </button>
            </div>
        </div>
    </header>

    <div class="shrink-0 px-4 pt-3 pb-1">
        <input id="search-input" type="search" placeholder="Caută identificator sau VIN..." class="w-full max-w-2xl mx-auto mb-4 bg-slate-900 border border-slate-700 rounded-full px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500 block" />
    </div>

    <div id="vin-grid" class="flex flex-wrap justify-center gap-4 p-4 items-start content-start w-full max-w-5xl mx-auto overflow-y-auto flex-1"></div>

    <div id="modal-vin" class="hidden fixed inset-0 z-50">
        <div class="absolute inset-0 bg-black/70"></div>
        <div class="relative h-full w-full grid place-items-center p-4">
            <div class="w-full max-w-lg rounded-2xl border border-slate-800/70 bg-slate-950 shadow-xl">
                <div class="px-5 py-4 border-b border-slate-800/70 flex items-center justify-between">
                    <div id="modal-title" class="text-lg font-bold text-slate-100">Adaugă VIN</div>
                    <button id="btn-close-modal" type="button" class="rounded-xl px-3 py-2 text-slate-300 hover:text-white hover:bg-slate-900/60 transition-colors">Închide</button>
                </div>
                <form id="form-vin" class="p-5 grid gap-4">
                    <label class="grid gap-1">
                        <span class="text-xs font-semibold text-slate-400">Nume / Auto</span>
                        <input id="f-ident" required autocomplete="off" class="rounded-xl bg-slate-900/60 border border-slate-800/70 px-3 py-2.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-purple-500/60" />
                    </label>
                    <label class="grid gap-1">
                        <span class="text-xs font-semibold text-slate-400">Seria VIN</span>
                        <input id="f-vin" required autocomplete="off" class="rounded-xl bg-slate-900/60 border border-slate-800/70 px-3 py-2.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-purple-500/60 font-mono tracking-wider" />
                    </label>
                    <div class="flex items-center justify-between gap-2 pt-2">
                        <button id="btn-cancel-modal" type="button" class="rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-900/60 transition-colors">Anulează</button>
                        <button id="btn-save-modal" type="submit" class="rounded-xl bg-purple-600 hover:bg-purple-500 px-4 py-2.5 text-sm font-bold text-white shadow-sm transition-colors">Salvează</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabase.createClient('https://xyovkxmtbvgcwavuyxxu.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5b3ZreG10YnZnY3dhdnV5eHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDI1ODMsImV4cCI6MjA5NTkxODU4M30.r-_Q0vTd4IdZrfJTwpsy8ptVp5krofFGKi4BqtHQl74');

        const vinGridEl = document.getElementById('vin-grid');
        const searchInput = document.getElementById('search-input');
        const btnOpenModal = document.getElementById('btn-open-modal');

        const modalEl = document.getElementById('modal-vin');
        const modalTitleEl = document.getElementById('modal-title');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCancelModal = document.getElementById('btn-cancel-modal');
        const btnSaveModal = document.getElementById('btn-save-modal');
        const formEl = document.getElementById('form-vin');
        const fIdent = document.getElementById('f-ident');
        const fVin = document.getElementById('f-vin');

        let allRows = [];
        let searchQuery = '';
        let editingId = null;
        const copyTimers = new Map();

        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        })[ch]);

        const openModal = () => modalEl.classList.remove('hidden');
        const closeModal = () => modalEl.classList.add('hidden');

        const setSaving = (saving) => {
            btnSaveModal.disabled = saving;
            btnSaveModal.classList.toggle('opacity-60', saving);
            btnSaveModal.classList.toggle('cursor-not-allowed', saving);
            btnSaveModal.textContent = saving ? 'Se salvează...' : 'Salvează';
        };

        const applyFilter = () => {
            const q = searchQuery.trim().toLowerCase();
            if (!q) return allRows;
            return allRows.filter((r) => {
                const hay = `${r.identificator ?? ''} ${r.vin ?? ''}`.toLowerCase();
                return hay.includes(q);
            });
        };

        const renderRows = () => {
            const rows = applyFilter();
            vinGridEl.innerHTML = rows.map((row) => {
                const vinText = String(row.vin ?? '').trim();
                return `
                    <div class="bg-slate-800 border border-slate-700 p-3 rounded-lg w-full max-w-[400px] flex-none hub-card">
                        <div class="flex justify-between items-start gap-2">
                            <div title="${escapeHtml(row.identificator)}" class="text-sm font-semibold text-slate-200 line-clamp-2 min-h-[2.5rem] flex-1">${escapeHtml(row.identificator)}</div>
                            <button type="button" data-edit-id="${escapeHtml(row.id)}" class="edit-btn text-xs text-slate-400 hover:text-slate-200 cursor-pointer whitespace-nowrap mt-1">
                                Modifică
                            </button>
                        </div>
                        <div class="flex justify-between items-center mt-3">
                            <div class="min-w-0 text-purple-300 font-mono text-sm tracking-wider truncate">${escapeHtml(vinText)}</div>
                            <button type="button" data-copy-id="${escapeHtml(row.id)}" data-copy-vin="${escapeHtml(vinText)}" class="copy-btn shrink-0 text-xs font-bold px-2 py-1 rounded bg-slate-900/60 border border-slate-700 text-slate-200 hover:bg-slate-900 transition-colors">
                                COPY
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        };

        const fetchRows = async () => {
            const { data, error } = await supabaseClient
                .from('baza_vin')
                .select('id, identificator, vin')
                .order('id', { ascending: false });

            if (error) {
                vinGridEl.innerHTML = '';
                return;
            }

            allRows = Array.isArray(data) ? data : [];
            renderRows();
        };

        const resetForm = () => {
            editingId = null;
            modalTitleEl.textContent = 'Adaugă VIN';
            formEl.reset();
        };

        const fillForm = (row) => {
            fIdent.value = row.identificator ?? '';
            fVin.value = row.vin ?? '';
        };

        btnOpenModal.addEventListener('click', () => {
            resetForm();
            openModal();
        });

        btnCloseModal.addEventListener('click', closeModal);
        btnCancelModal.addEventListener('click', closeModal);

        modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl.firstElementChild) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            closeModal();
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value || '';
            renderRows();
        });

        vinGridEl.addEventListener('click', async (e) => {
            const copyBtn = e.target.closest('.copy-btn');
            if (copyBtn) {
                const id = copyBtn.dataset.copyId;
                const vin = copyBtn.dataset.copyVin || '';
                if (!id || !vin) return;

                try {
                    await navigator.clipboard.writeText(vin);
                } catch (_) {
                    return;
                }

                if (copyTimers.has(id)) clearTimeout(copyTimers.get(id));
                copyBtn.textContent = 'Copiat!';
                copyBtn.classList.add('bg-emerald-600', 'border-emerald-600', 'text-white');
                copyBtn.classList.remove('bg-slate-900/60', 'border-slate-700', 'text-slate-200');

                const t = setTimeout(() => {
                    copyBtn.textContent = 'COPY';
                    copyBtn.classList.remove('bg-emerald-600', 'border-emerald-600', 'text-white');
                    copyBtn.classList.add('bg-slate-900/60', 'border-slate-700', 'text-slate-200');
                    copyTimers.delete(id);
                }, 2000);
                copyTimers.set(id, t);
                return;
            }

            const editBtn = e.target.closest('.edit-btn');
            if (editBtn) {
                const id = editBtn.dataset.editId;
                const row = allRows.find((r) => String(r.id) === String(id));
                if (!row) return;
                editingId = row.id;
                modalTitleEl.textContent = 'Modifică VIN';
                fillForm(row);
                openModal();
            }
        });

        formEl.addEventListener('submit', async (e) => {
            e.preventDefault();
            setSaving(true);

            const payload = {
                identificator: fIdent.value.trim(),
                vin: fVin.value.trim(),
            };

            let error;
            if (editingId) {
                ({ error } = await supabaseClient.from('baza_vin').update(payload).eq('id', editingId));
            } else {
                ({ error } = await supabaseClient.from('baza_vin').insert(payload));
            }

            setSaving(false);
            if (error) return;
            closeModal();
            await fetchRows();
        });

        supabaseClient
            .channel('baza-vin-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'baza_vin' }, () => { fetchRows(); })
            .subscribe();

        fetchRows();
    </script>
</body>
</html>
