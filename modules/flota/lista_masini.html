<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Mașini - HUB Service Auto</title>
    <script src="https://cdn.tailwindcss.com?plugins=line-clamp"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/audit.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="manifest" href="/manifest.json">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-950 text-slate-200">
    <header class="shrink-0 border-b border-slate-800/60 bg-slate-950/80 backdrop-blur">
        <div class="px-4 py-4">
            <div class="grid grid-cols-[auto,1fr,auto] items-center gap-3">
                <a href="../../index.html" class="justify-self-start inline-flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-900/60 transition-colors">
                    <- Înapoi
                </a>
                <div class="justify-self-center flex items-center justify-center gap-3">
                    <div class="text-xl font-bold text-purple-400 tracking-wide">
                        FLOTA AUTO
                    </div>
                    <input id="search-nr" type="search" placeholder="Caută nr. auto..." class="bg-slate-900 border border-slate-700 rounded-full px-4 py-1 text-sm text-slate-200 focus:outline-none focus:border-purple-500 w-64" />
                </div>
                <button id="btn-open-modal" type="button" class="justify-self-end inline-flex items-center rounded-xl bg-purple-600 hover:bg-purple-500 px-4 py-2 text-sm font-bold text-white shadow-sm transition-colors">
                    + MAȘINĂ NOUĂ
                </button>
            </div>
        </div>
    </header>

    <div id="cars-container" class="flex-1 overflow-y-auto w-full">
        <div id="cars-empty" class="grid place-items-center rounded-2xl border border-dashed border-slate-800/70 bg-slate-900/20 text-slate-500 p-6 m-4">
            Se încarcă...
        </div>
        <div id="cars-grid" class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-4 p-4"></div>
    </div>

    <div id="modal-car" class="hidden fixed inset-0 z-50">
        <div class="absolute inset-0 bg-black/70"></div>
        <div class="relative h-full w-full grid place-items-center p-4">
            <div class="w-full max-w-2xl rounded-2xl border border-slate-800/70 bg-slate-950 shadow-xl">
                <div class="px-5 py-4 border-b border-slate-800/70 flex items-center justify-between">
                    <div id="modal-title" class="text-lg font-bold text-slate-100">Adaugă Mașină</div>
                    <button id="btn-close-modal" type="button" class="rounded-xl px-3 py-2 text-slate-300 hover:text-white hover:bg-slate-900/60 transition-colors">Închide</button>
                </div>
                <form id="form-car" class="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <label class="grid gap-1">
                        <span class="text-xs font-semibold text-slate-400">Nr Înmatriculare</span>
                        <input id="f-nr" required autocomplete="off" class="rounded-xl bg-slate-900/60 border border-slate-800/70 px-3 py-2.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-purple-500/60" />
                    </label>
                    <label class="grid gap-1">
                        <span class="text-xs font-semibold text-slate-400">VIN</span>
                        <input id="f-vin" required autocomplete="off" class="rounded-xl bg-slate-900/60 border border-slate-800/70 px-3 py-2.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-purple-500/60" />
                    </label>
                    <label class="grid gap-1 sm:col-span-2">
                        <span class="text-xs font-semibold text-slate-400">Marcă</span>
                        <input id="f-marca" required autocomplete="off" class="rounded-xl bg-slate-900/60 border border-slate-800/70 px-3 py-2.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-purple-500/60" />
                    </label>
                    <label class="grid gap-1">
                        <span class="text-xs font-semibold text-slate-400">Data RCA</span>
                        <input id="f-rca" type="date" class="rounded-xl bg-slate-900/60 border border-slate-800/70 px-3 py-2.5 text-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-purple-500/60" />
                    </label>
                    <label class="grid gap-1">
                        <span class="text-xs font-semibold text-slate-400">Data ITP</span>
                        <input id="f-itp" type="date" class="rounded-xl bg-slate-900/60 border border-slate-800/70 px-3 py-2.5 text-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-purple-500/60" />
                    </label>
                    <label class="grid gap-1">
                        <span class="text-xs font-semibold text-slate-400">Data Rovinietă</span>
                        <input id="f-rov" type="date" class="rounded-xl bg-slate-900/60 border border-slate-800/70 px-3 py-2.5 text-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-purple-500/60" />
                    </label>
                    <label class="grid gap-1 sm:col-span-2">
                        <span class="text-xs font-semibold text-slate-400">Link Acte Drive</span>
                        <input id="f-link" autocomplete="off" class="rounded-xl bg-slate-900/60 border border-slate-800/70 px-3 py-2.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-purple-500/60" />
                    </label>
                    <label class="grid gap-1 sm:col-span-2">
                        <span class="text-xs font-semibold text-slate-400">Observații</span>
                        <textarea id="f-obs" rows="3" class="rounded-xl bg-slate-900/60 border border-slate-800/70 px-3 py-2.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-purple-500/60"></textarea>
                    </label>
                    <div class="sm:col-span-2 flex items-center justify-between gap-2 pt-2">
                        <button id="btn-cancel-modal" type="button" class="rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-900/60 transition-colors">Anulează</button>
                        <button id="btn-save-modal" type="submit" class="rounded-xl bg-purple-600 hover:bg-purple-500 px-4 py-2.5 text-sm font-bold text-white shadow-sm transition-colors">Salvează</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabase.createClient('https://xyovkxmtbvgcwavuyxxu.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5b3ZreG10YnZnY3dhdnV5eHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDI1ODMsImV4cCI6MjA5NTkxODU4M30.r-_Q0vTd4IdZrfJTwpsy8ptVp5krofFGKi4BqtHQl74');
        window.supabaseClient = supabaseClient;

        const carsEmptyEl = document.getElementById('cars-empty');
        const carsGridEl = document.getElementById('cars-grid');
        const btnOpenModal = document.getElementById('btn-open-modal');
        const searchNrEl = document.getElementById('search-nr');
        const modalEl = document.getElementById('modal-car');
        const modalTitleEl = document.getElementById('modal-title');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCancelModal = document.getElementById('btn-cancel-modal');
        const btnSaveModal = document.getElementById('btn-save-modal');
        const formEl = document.getElementById('form-car');

        const fNr = document.getElementById('f-nr');
        const fVin = document.getElementById('f-vin');
        const fMarca = document.getElementById('f-marca');
        const fRca = document.getElementById('f-rca');
        const fItp = document.getElementById('f-itp');
        const fRov = document.getElementById('f-rov');
        const fLink = document.getElementById('f-link');
        const fObs = document.getElementById('f-obs');

        let allCars = [];
        let editingId = null;
        let searchNrQuery = '';
        let auditActorPromise = null;

        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        })[ch]);

        async function getAuditActor() {
            if (!auditActorPromise) {
                auditActorPromise = (async () => {
                    try {
                        const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
                        if (sessionError) throw sessionError;

                        const user = sessionData?.session?.user;
                        if (!user?.id) return { user_id: null, user_name: '' };

                        const { data: profile, error: profileError } = await supabaseClient
                            .from('auth_profiles')
                            .select('porecla')
                            .eq('id', user.id)
                            .maybeSingle();

                        if (profileError) throw profileError;

                        return {
                            user_id: user.id,
                            user_name: profile?.porecla || user.email || '',
                        };
                    } catch (error) {
                        console.error(error);
                        return { user_id: null, user_name: '' };
                    }
                })();
            }

            return auditActorPromise;
        }

        async function logFlotaAudit(actiune, descriere, entitateId) {
            try {
                if (typeof window.addAuditLog !== 'function') return;

                const cleanEntityId = String(entitateId || '').trim();
                if (!cleanEntityId) return;

                const actor = await getAuditActor();
                await window.addAuditLog({
                    modul: 'Flotă',
                    actiune,
                    descriere,
                    entitate: 'flota',
                    entitate_id: cleanEntityId,
                    user_id: actor.user_id,
                    user_name: actor.user_name,
                });
            } catch (error) {
                console.error(error);
            }
        }

        const toDateInput = (value) => {
            if (!value) return '';
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return String(value).slice(0, 10);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const daysUntil = (dateValue) => {
            if (!dateValue) return null;
            const d = new Date(String(dateValue).slice(0, 10));
            if (Number.isNaN(d.getTime())) return null;
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            d.setHours(0, 0, 0, 0);
            const msPerDay = 24 * 60 * 60 * 1000;
            return Math.round((d.getTime() - now.getTime()) / msPerDay);
        };

        const semafor = (car) => {
            const vals = [daysUntil(car.data_rca), daysUntil(car.data_itp), daysUntil(car.data_rovinieta)];
            if (vals.some((v) => v !== null && v < 0)) return 'red';
            if (vals.some((v) => v === null || (v >= 0 && v <= 30))) return 'amber';
            return 'green';
        };

        const pill = (label, days) => {
            const d = days;
            const text = d === null ? 'N/A' : `${d} zile`;
            let cls = 'text-slate-300';
            if (d !== null && d < 0) cls = 'text-rose-300';
            else if (d !== null && d <= 30) cls = 'text-amber-300';
            else if (d !== null) cls = 'text-emerald-300';
            return `<div class="flex items-center justify-between gap-3 text-sm"><span class="text-slate-400">${escapeHtml(label)}</span><span class="font-bold ${cls}">${escapeHtml(text)}</span></div>`;
        };

        const renderCars = () => {
            const q = searchNrQuery.trim().toLowerCase();
            const visibleCars = q
                ? allCars.filter((c) => String(c.nr_inmatriculare ?? '').toLowerCase().includes(q))
                : allCars;

            carsGridEl.innerHTML = visibleCars.map((masina) => {
                const s = semafor(masina);
                const border = s === 'red' ? 'border-l-rose-500' : s === 'amber' ? 'border-l-amber-500' : 'border-l-emerald-500';
                const hasLink = !!(masina.link_acte && String(masina.link_acte).trim());
                const linkCls = hasLink
                    ? 'bg-slate-900/40 hover:bg-slate-900/70 text-slate-200 border border-slate-800/70'
                    : 'bg-slate-900/20 text-slate-500 border border-slate-800/40 opacity-50 pointer-events-none';
                const obs = String(masina.observatii ?? '').trim();

                return `
                    <div class="rounded-2xl border border-slate-800/70 border-l-4 ${border} bg-slate-900/30 p-4 shadow-sm w-full relative hub-card">
                        ${obs ? `
                            <div class="absolute top-3 right-3 group cursor-help z-20">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-blue-400 hover:text-blue-300">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <div class="absolute hidden group-hover:block z-50 w-64 p-3 bg-slate-800 border border-slate-600 rounded-lg shadow-2xl text-sm text-slate-200 right-0 top-8 text-left break-words">${escapeHtml(masina.observatii.trim())}</div>
                            </div>
                        ` : ''}
                        <div class="flex items-start justify-between gap-3">
                            <div class="min-w-0">
                                <div class="truncate text-lg font-extrabold text-slate-100">${escapeHtml(masina.nr_inmatriculare)}</div>
                                <div class="mt-1 text-xs text-slate-500">${escapeHtml(masina.marca)} • VIN: ${escapeHtml(masina.vin)}</div>
                            </div>
                        </div>

                        <hr class="border-slate-800/70 my-3">

                        <div class="grid gap-1.5">
                            ${pill('RCA', daysUntil(masina.data_rca))}
                            ${pill('ITP', daysUntil(masina.data_itp))}
                            ${pill('Rovinietă', daysUntil(masina.data_rovinieta))}
                        </div>

                        <div class="mt-3 flex items-center justify-between gap-2">
                            <button type="button" data-id="${escapeHtml(masina.id)}" class="btn-edit flex-1 rounded-xl px-4 py-2.5 text-sm font-bold bg-slate-900/40 hover:bg-slate-900/70 text-slate-200 border border-slate-800/70 transition-colors">
                                Modifică
                            </button>
                            <a href="${hasLink ? escapeHtml(String(masina.link_acte).trim()) : '#'}" target="_blank" rel="noopener noreferrer" class="flex-1 text-center rounded-xl px-4 py-2.5 text-sm font-bold transition-colors ${linkCls}">
                                Acte
                            </a>
                        </div>
                    </div>
                `;
            }).join('');

            const hasAny = visibleCars.length > 0;
            carsEmptyEl.classList.toggle('hidden', hasAny);
            if (!hasAny) carsEmptyEl.textContent = q ? 'Niciun rezultat.' : 'Nu există mașini.';
        };

        const fetchCars = async () => {
            carsEmptyEl.textContent = 'Se încarcă...';
            carsEmptyEl.classList.remove('hidden');

            const { data, error } = await supabaseClient
                .from('flota_auto')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                carsEmptyEl.textContent = 'Eroare la încărcare.';
                carsGridEl.innerHTML = '';
                return;
            }

            allCars = Array.isArray(data) ? data : [];
            renderCars();
        };

        const openModal = () => modalEl.classList.remove('hidden');
        const closeModal = () => modalEl.classList.add('hidden');

        const setSaving = (saving) => {
            btnSaveModal.disabled = saving;
            btnSaveModal.classList.toggle('opacity-60', saving);
            btnSaveModal.classList.toggle('cursor-not-allowed', saving);
            btnSaveModal.textContent = saving ? 'Se salvează...' : 'Salvează';
        };

        const resetForm = () => {
            editingId = null;
            modalTitleEl.textContent = 'Adaugă Mașină';
            formEl.reset();
        };

        const fillForm = (car) => {
            fNr.value = car.nr_inmatriculare ?? '';
            fVin.value = car.vin ?? '';
            fMarca.value = car.marca ?? '';
            fRca.value = toDateInput(car.data_rca);
            fItp.value = toDateInput(car.data_itp);
            fRov.value = toDateInput(car.data_rovinieta);
            fLink.value = car.link_acte ?? '';
            fObs.value = car.observatii ?? '';
        };

        btnOpenModal.addEventListener('click', () => {
            resetForm();
            openModal();
        });

        searchNrEl.addEventListener('input', (e) => {
            searchNrQuery = e.target.value || '';
            renderCars();
        });

        btnCloseModal.addEventListener('click', () => closeModal());
        btnCancelModal.addEventListener('click', () => closeModal());

        modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl.firstElementChild) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            closeModal();
        });

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-edit');
            if (!btn) return;
            const id = btn.dataset.id;
            const car = allCars.find((c) => String(c.id) === String(id));
            if (!car) return;
            editingId = car.id;
            modalTitleEl.textContent = 'Modifică Mașină';
            fillForm(car);
            openModal();
        });

        formEl.addEventListener('submit', async (e) => {
            e.preventDefault();
            setSaving(true);

            const payload = {
                nr_inmatriculare: fNr.value.trim(),
                vin: fVin.value.trim(),
                marca: fMarca.value.trim(),
                data_rca: fRca.value || null,
                data_itp: fItp.value || null,
                data_rovinieta: fRov.value || null,
                link_acte: fLink.value.trim() || null,
                observatii: fObs.value.trim() || null,
            };

            let error;
            const editedCar = editingId ? allCars.find((car) => String(car.id) === String(editingId)) : null;
            const auditCarLabel = payload.nr_inmatriculare || editedCar?.nr_inmatriculare || editingId || '';
            const auditEntityId = editingId || payload.nr_inmatriculare;

            if (editingId) {
                ({ error } = await supabaseClient.from('flota_auto').update(payload).eq('id', editingId));
            } else {
                ({ error } = await supabaseClient.from('flota_auto').insert(payload));
            }

            setSaving(false);
            if (error) return;
            if (editingId) {
                logFlotaAudit('UPDATE', `A modificat mașina ${auditCarLabel}`, auditEntityId);
            } else {
                logFlotaAudit('CREATE', `A adăugat mașina ${auditCarLabel}`, auditEntityId);
            }
            closeModal();
            await fetchCars();
        });

        supabaseClient
            .channel('flota-auto-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'flota_auto' }, () => { fetchCars(); })
            .subscribe();

        fetchCars();
    </script>
</body>
</html>
