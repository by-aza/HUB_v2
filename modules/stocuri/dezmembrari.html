<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dezmembrări — HUB</title>
  <!-- Clientul Supabase comun folosit de modulele HUB -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/dezmembrari.css">
</head>
<body>
  <!-- Shell principal desktop pentru modulul Dezmembrari -->
  <div class="dez-app">
    <!-- Zona principala cu lista si detalii -->
    <main class="dez-main">
      <section class="dez-left">
        <div class="dez-module-head">
          <!-- Buton inapoi aliniat dupa modelul HUB din pagina Avansuri -->
          <button class="dez-back-btn" id="backBtn" type="button">
            <i data-lucide="arrow-left" aria-hidden="true">←</i>
            <span>Înapoi</span>
          </button>
          <div class="dez-module-title">
            <h1>Dezmembrări</h1>
            <p>Gestionare mașini, motoare și cutii de viteză din parcul de dezmembrări</p>
          </div>
          <button class="dez-btn dez-btn-primary" id="newItemBtn" type="button">＋ Adaugă piesă / mașină</button>
        </div>

        <!-- Filtrele principale dupa statusul publicarii -->
        <div class="dez-filters" id="filterBar">
          <button class="dez-filter active" type="button" data-filter="all">Toate <b>0</b></button>
          <button class="dez-filter" type="button" data-filter="draft">De completat <b>0</b></button>
          <button class="dez-filter" type="button" data-filter="ready">Gata de publicare <b>0</b></button>
          <button class="dez-filter" type="button" data-filter="published">Publicat <b>0</b></button>
          <button class="dez-filter" type="button" data-filter="sold">Vândut <b>0</b></button>
          <button class="dez-filter" type="button" data-filter="archived">Arhivat <b>0</b></button>
        </div>

        <!-- Toolbar compact pentru cautarea in lista -->
        <div class="dez-list-toolbar">
          <input class="dez-list-search" id="listSearchInput" type="search" placeholder="Caută în listă...">
          <select class="dez-mini-select" id="typeFilter">
            <option value="all">Toate tipurile</option>
            <option value="car">Mașină</option>
            <option value="engine">Motor</option>
            <option value="gearbox">Cutie viteze</option>
            <option value="part">Altă piesă</option>
          </select>
          <select class="dez-mini-select" id="statusFilterSelect">
            <option value="all">Toate statusurile</option>
            <option value="draft">De completat</option>
            <option value="ready">Gata de publicare</option>
            <option value="published">Publicat</option>
            <option value="sold">Vândut</option>
            <option value="archived">Arhivat</option>
          </select>
          <select class="dez-mini-select" id="sortSelect">
            <option value="date">Data adăugării</option>
            <option value="price">Preț</option>
            <option value="name">Denumire</option>
          </select>
        </div>

        <div class="dez-item-list" id="itemList"></div>
        <div class="dez-list-foot" id="listFoot"></div>
      </section>

      <!-- Fundal de inchidere pentru panoul drawer la desktop ingust -->
      <button class="dez-drawer-backdrop" id="drawerBackdrop" type="button" aria-label="Închide detaliile"></button>

      <!-- Panoul de detalii cu galerie si campuri compacte -->
      <section class="dez-detail-pane" id="detailPane"></section>
    </main>
  </div>

  <!-- Modal desktop compact pentru aceeasi captura minima folosita pe mobil -->
  <div class="dez-capture-modal" id="desktopCaptureModal" aria-hidden="true" inert>
    <button class="dez-capture-backdrop" type="button" data-close-capture aria-label="Închide formularul"></button>
    <section class="dez-capture-dialog" role="dialog" aria-modal="true" aria-labelledby="desktopCaptureTitle">
      <!-- Antetul modalului si actiunea rapida de inchidere -->
      <header class="dez-capture-head">
        <div>
          <h2 id="desktopCaptureTitle">Adaugă piesă / mașină</h2>
          <p>Captură rapidă pentru parcul de dezmembrări</p>
        </div>
        <button class="dez-capture-close" type="button" data-close-capture aria-label="Închide">×</button>
      </header>

      <form class="dez-capture-form" id="desktopCaptureForm">
        <!-- Selectorul tipului de articol -->
        <fieldset class="dez-capture-types">
          <legend>Tip</legend>
          <div class="dez-capture-type-grid">
            <button class="dez-capture-type active" type="button" data-capture-type="car">Mașină</button>
            <button class="dez-capture-type" type="button" data-capture-type="engine">Motor</button>
            <button class="dez-capture-type" type="button" data-capture-type="gearbox">Cutie</button>
            <button class="dez-capture-type" type="button" data-capture-type="part">Altă piesă</button>
          </div>
        </fieldset>

        <!-- Picker multiplu si thumbnail-uri locale, maximum 9 fotografii -->
        <section class="dez-capture-photos">
          <div class="dez-capture-label-row">
            <strong>Fotografii</strong>
            <span id="desktopCapturePhotoCount">0 / 9</span>
          </div>
          <input id="desktopCapturePhotoInput" type="file" accept="image/*" multiple hidden>
          <button class="dez-capture-photo-picker" id="desktopCapturePhotoPicker" type="button">＋ Selectează fotografii</button>
          <div class="dez-capture-photo-grid" id="desktopCapturePhotoGrid"></div>
        </section>

        <!-- Campul apare doar pentru tipul Alta piesa -->
        <label class="dez-capture-field" id="desktopCapturePartNameField" hidden>
          <span>Denumire piesă</span>
          <input id="desktopCapturePartName" type="text" placeholder="Ex: Haion, capotă, ușă..." autocomplete="off">
        </label>

        <!-- Datele text minimale ale capturii -->
        <label class="dez-capture-field">
          <span>VIN / Serie caroserie</span>
          <input id="desktopCaptureVin" type="text" placeholder="Ex: WBAPD11020A123456" autocomplete="off">
        </label>
        <label class="dez-capture-field dez-capture-field-full">
          <span>Observații <small>(opțional)</small></span>
          <textarea id="desktopCaptureNotes" placeholder="Detalii rapide despre articol"></textarea>
        </label>

        <!-- Mesajele raman in modal pentru validare clara -->
        <p class="dez-capture-message" id="desktopCaptureMessage" role="status" aria-live="polite"></p>

        <!-- Actiunile finale ale capturii -->
        <footer class="dez-capture-actions">
          <button class="dez-btn dez-btn-ghost" type="button" data-close-capture>Anulează</button>
          <button class="dez-btn dez-btn-primary" id="desktopCaptureSave" type="submit">Salvează</button>
        </footer>
      </form>
    </section>
  </div>

  <!-- Overlay desktop pentru selectarea stricta a zonei in care apare seria VIN -->
  <div class="dez-vin-crop-modal" id="desktopVinCropModal" aria-hidden="true" inert>
    <button class="dez-vin-crop-backdrop" type="button" data-close-vin-crop aria-label="Închide decuparea VIN"></button>
    <section class="dez-vin-crop-dialog" role="dialog" aria-modal="true" aria-labelledby="desktopVinCropTitle">
      <!-- Antetul si instructiunile rapide pentru decupare -->
      <header class="dez-vin-crop-head">
        <div>
          <h2 id="desktopVinCropTitle">Selectează zona cu VIN</h2>
          <p>Trage peste seria completă, cât mai strâns în jurul celor 17 caractere.</p>
        </div>
        <button class="dez-capture-close" type="button" data-close-vin-crop aria-label="Închide">×</button>
      </header>

      <!-- Canvasul foloseste local fotografia deja selectata in formular -->
      <div class="dez-vin-crop-stage" id="desktopVinCropStage">
        <canvas id="desktopVinCropCanvas" tabindex="0" aria-label="Selectează cu mouse-ul zona care conține VIN-ul"></canvas>
      </div>
      <p class="dez-vin-crop-message" id="desktopVinCropMessage" role="status" aria-live="polite"></p>

      <!-- Rotirea modifica numai previzualizarea si decupajul trimis catre OCR -->
      <footer class="dez-vin-crop-actions">
        <div class="dez-vin-rotate-controls" role="group" aria-label="Rotire decupaj VIN">
          <button class="dez-btn dez-btn-ghost" id="desktopVinRotateLeft" type="button" title="Rotește 90° la stânga" aria-label="Rotește 90° la stânga">↶ 90°</button>
          <button class="dez-btn dez-btn-ghost" id="desktopVinRotateRight" type="button" title="Rotește 90° la dreapta" aria-label="Rotește 90° la dreapta">↷ 90°</button>
        </div>
        <div class="dez-vin-crop-submit">
          <button class="dez-btn dez-btn-ghost" type="button" data-close-vin-crop>Anulează</button>
          <button class="dez-btn dez-btn-primary" id="desktopVinCropRead" type="button">Citește zona selectată</button>
        </div>
      </footer>
    </section>
  </div>

  <!-- Logica paginii trimite catre OCR numai decupajul ales, prin Edge Function -->
  <script src="/js/dezmembrari.js"></script>
</body>
</html>
