<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/192x192.png">
    <meta name="theme-color" content="#14161c">
    <link rel="stylesheet" href="/css/style.css">
</script>
    <title>Piese stoc magazie - HUB Service Auto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f1117; color: #ededed; margin: 0; overflow-x: hidden; }
        
        .fixed-header { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: #0f1117; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1001; }
        .header-divider-mov { position: fixed; top: 70px; left: 0; width: 100%; height: 1px; background: #6a0dad; z-index: 1001; }
        
        .sticky-controls { 
            position: sticky; 
            top: 71px; 
            background: #0f1117; 
            z-index: 1000; 
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .content-area { margin-top: 71px; padding-bottom: 40px; display: flex; flex-direction: column; align-items: center; }
        #productList { width: 100%; max-width: 95%; margin: 0 auto; }

        /* Noul CSS pentru Carduri */
        .product-card { 
            background-color: #161922; 
            border: 1px solid #2d3345; 
            padding: 12px 16px; 
            border-radius: 10px; 
            margin-bottom: 12px; 
            display: flex; 
            width: 100%;
        }

        .card-left { flex: 0 0 70%; padding-right: 10px; }
        .card-right { flex: 0 0 30%; text-align: right; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }

        .product-title { color: #ffffff; font-size: 20px; font-weight: 600; line-height: 1.3; margin-bottom: 0px; }
        .product-price { color: #ffffff; font-size: 15px; font-weight: 400; }
        .product-meta { color: #9098aa; font-size: 15px; }

        .badge { padding: 2px 8px; border-radius: 4px; font-size: 14px; text-transform: uppercase; font-weight: 400; display: inline-flex; align-items: center; gap: 4px; }
        .badge-nou { background-color: #059669; color: #ffffff; }
        .badge-sh { background-color: #d97706; color: #ffffff; }

        .text-red-stock { color: #ff0000 !important; }

        .btn-whatsapp { background: #25D366; color: white; margin-top: 10px; }
        .btn-link { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #3b82f6; }

        .search-input { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: white; }
        .filter-pill { padding: 4px 12px; border-radius: 99px; font-size: 13px; font-weight: 300; background: #1a1d26; cursor: pointer; border: 1px solid #374151; color: #ffffff; transition: all 0.2s; }
        #filter-Toate.active { background-color: #a050e6; border-color: #4b5563; }
        #filter-NOU.active { background-color: #059669; border-color: #10b981; }
        #filter-SH.active { background-color: #d97706; border-color: #f59e0b; }

        #loader { display: none; text-align: center; padding: 40px; color: #6a0dad; }
        .loading #loader { display: block; }
    </style>
</head>
<body class="min-h-screen">
    <header class="fixed-header">
        <div class="flex items-center gap-3">
            <img src="../../icons/128x128.png" alt="Logo" style="width: 40px;">
            <h1 class="text-xl font-bold">Piese stoc magazie</h1>
        </div>
        <a href="../../index.html" class="bg-[#6a0dad]/20 hover:bg-[#6a0dad]/40 text-white px-4 py-2 rounded-xl flex items-center gap-2 transition-all border border-[#6a0dad]/30">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span class="text-sm font-medium">Înapoi</span>
        </a>
    </header>
    <div class="header-divider-mov"></div>

    <main class="content-area">
        <div class="sticky-controls w-full max-w-[95%]">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div class="relative flex-1 max-w-md">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-500"></i>
                    <input type="text" id="searchInput" placeholder="Caută după denumire sau cod..." class="search-input w-full pl-10 pr-4 py-2 rounded-xl text-sm outline-none">
                </div>
                <div class="flex items-center gap-2 overflow-x-auto">
                    <button onclick="setFilter('Toate')" id="filter-Toate" class="filter-pill active">Toate</button>
                    <button onclick="setFilter('NOU')" id="filter-NOU" class="filter-pill">NOU</button>
                    <button onclick="setFilter('SH')" id="filter-SH" class="filter-pill">SH</button>
                    <span id="productCounter" class="text-xs text-neutral-500 ml-2 whitespace-nowrap">0 produse afișate</span>
                </div>
            </div>
        </div>

        <div id="loader">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto"></i>
        </div>

        <div id="productList"></div>
    </main>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7mX8RLv-YJ8OU0zCF3Kt6khLDosTW5wAZJ6Ba83Xd8U24gNqXIupTdwJl_j3tftiOdfAqo2E1cPeL/pub?gid=307976863&single=true&output=csv';
        const WHATSAPP_NUMBER = '40754488535';
        let allProducts = [];
        let currentFilter = 'Toate';

        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            document.getElementById('searchInput').addEventListener('input', renderProducts);
            lucide.createIcons();
        });

        async function loadProducts() {
            document.body.classList.add('loading');
            const cachedData = localStorage.getItem('piese_stoc_cache');
            if (cachedData) { allProducts = JSON.parse(cachedData); renderProducts(); }
            Papa.parse(CSV_URL, {
                download: true,
                header: false,
                complete: (results) => {
                    document.body.classList.remove('loading');
                    if (results.data && results.data.length > 0) {
                        allProducts = results.data.slice(1).filter(row => row[2]);
                        localStorage.setItem('piese_stoc_cache', JSON.stringify(allProducts));
                        renderProducts();
                    }
                },
                error: () => document.body.classList.remove('loading')
            });
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${filter}`).classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const productList = document.getElementById('productList');
            productList.innerHTML = '';
            const filtered = allProducts.filter(row => {
                const matchesSearch = (row[2]||'').toLowerCase().includes(searchTerm) || (row[1]||'').toLowerCase().includes(searchTerm);
                const matchesFilter = currentFilter === 'Toate' || (row[4]||'').toUpperCase() === currentFilter;
                return matchesSearch && matchesFilter;
            });
            document.getElementById('productCounter').textContent = `${filtered.length} produse afișate`;
            filtered.forEach(row => {
                const stock = (row[8] || '0').trim();
                const isOutOfStock = stock === '0';
                const redClass = isOutOfStock ? 'text-red-stock' : '';
                const condition = (row[4] || '-').toUpperCase();
                const linkSite = row[10] || '#';
                const waMessage = encodeURIComponent(`${row[2] || '-'}\n${row[5] || '-'}\n${row[3] || '-'}\n${linkSite}`);
                
                const card = document.createElement('div');
                card.className = 'product-card hub-card';
                card.innerHTML = `
                    <div class="card-left">
                        <div class="product-title ${redClass}">${row[2] || '-'}</div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="badge ${condition === 'NOU' ? 'badge-nou' : 'badge-sh'}">${condition}</span>
                            <span class="product-meta">Raft: <span class="text-white">${row[5] || '-'}</span></span>
                            <span class="product-meta">Stoc: <span class="font-bold ${isOutOfStock ? 'text-red-stock' : 'text-orange-500'}">${stock}</span></span>
                        </div>
                        <div class="product-meta flex flex-wrap gap-3">
                            <span>Cod OEM: ${row[1] || '-'}</span>
                            <span>ID Site: ${row[9] || '-'}</span>
                            ${linkSite !== '#' ? `<a href="${linkSite}" target="_blank" class="btn-link px-2 py-0.5 rounded flex items-center gap-1">Link Site <i data-lucide="external-link" class="w-3 h-3"></i></a>` : ''}
                        </div>
                        ${!isOutOfStock ? `<a href="https://wa.me/${WHATSAPP_NUMBER}?text=${waMessage}" target="_blank" class="btn-whatsapp inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold no-underline"><i data-lucide="message-circle" class="w-4 h-4"></i> Comandă WhatsApp</a>` : ''}
                    </div>
                    <div class="card-right">
                        <div class="product-price ${redClass}">${row[7] || '-'} RON</div>
                        <div class="product-meta">${row[3] || ''}</div>
                    </div>
                `;
                productList.appendChild(card);
            });
            lucide.createIcons();
        }
    </script>
    <!-- Autodeconectare după inactivitate -->
    <script src="/js/session-timeout.js?v=2"></script>
</body>
</html>
